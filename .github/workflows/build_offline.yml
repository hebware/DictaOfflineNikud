
name: Build Hanakdan - 333MB Offline
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create service
        shell: pwsh
        run: |
          @"
          from fastapi import FastAPI
          from fastapi.responses import PlainTextResponse, JSONResponse
          from pydantic import BaseModel
          import traceback
          app = FastAPI()
          class Req(BaseModel):
              text: str
          nak = None
          load_log = ""
          try:
              print("Loading Hanakdan...")
              from nakdimon import Nakdimon
              nak = Nakdimon()
              test = nak.nakdan("שלום עולם")
              print(f"Test: {test}")
              load_log = f"OK - {test}"
          except Exception as e:
              load_log = f"Failed: {e} {traceback.format_exc()}"
              print(load_log)
          def add_nikud(t):
              if nak is None:
                  return t
              try:
                  r = nak.nakdan(t)
                  return "".join(c for c in r if not (0x0591 <= ord(c) <= 0x05AF))
              except:
                  return t
          @app.get("/", response_class=PlainTextResponse)
          def root():
              return f"Hanakdan 333MB nak={nak is not None} {load_log}"
          @app.post("/nikud", response_class=PlainTextResponse)
          def nikud_plain(req: Req):
              return PlainTextResponse(add_nikud(req.text), media_type="text/plain; charset=utf-8")
          @app.post("/nikud_json")
          def nikud_json(req: Req):
              return JSONResponse({"nikud": add_nikud(req.text), "nak": nak is not None})
          @app.post("/debug")
          def debug(req: Req):
              return {"input": req.text, "output": add_nikud(req.text), "nak": nak is not None}
          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="127.0.0.1", port=8080)
          "@ | Set-Content hanakdan_service.py -Encoding UTF8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build 333MB EXE
        shell: pwsh
        run: |
          pip install --upgrade pip
          pip install nakdimon fastapi uvicorn pyinstaller torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "from nakdimon import Nakdimon; n=Nakdimon(); print('Test:', n.nakdan('שלום עולם'))"
          Write-Host "Building 333MB Hanakdan..."
          pyinstaller --onefile hanakdan_service.py -n hanakdan_x64 --clean --noconfirm --collect-data nakdimon --collect-all nakdimon --collect-all torch --hidden-import torch --hidden-import torch.nn
          dir dist
          $size = (Get-Item dist/hanakdan_x64.exe).Length / 1MB
          Write-Host "EXE size: $size MB"

      - uses: actions/upload-artifact@v5
        with:
          name: hanakdan-333mb-exe
          path: dist/hanakdan_x64.exe
