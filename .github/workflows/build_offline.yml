
name: Build Dicta FIXED - With All Endpoints
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create service file
        shell: pwsh
        run: |
          @"
          from fastapi import FastAPI
          from fastapi.responses import PlainTextResponse, JSONResponse
          from pydantic import BaseModel
          app = FastAPI()
          class Req(BaseModel):
              text: str
          nak = None
          try:
              from nakdimon import Nakdimon
              nak = Nakdimon()
              print("Dicta loaded")
          except Exception as e:
              print(f"Fail: {e}")
          def add_nikud(t):
              if nak and hasattr(nak, 'nakdan'):
                  r = nak.nakdan(t)
                  return "".join(c for c in r if not (0x0591 <= ord(c) <= 0x05AF))
              return t
          @app.get("/", response_class=PlainTextResponse)
          def root():
              return f"Dicta OFFLINE nak={nak is not None} endpoints=/nikud,/nikud_json,/debug"
          @app.post("/nikud", response_class=PlainTextResponse)
          def nikud_plain(req: Req):
              result = add_nikud(req.text)
              print(f"REQ: {req.text!r} -> {result!r}")
              return PlainTextResponse(result, media_type="text/plain; charset=utf-8")
          @app.post("/nikud_json")
          def nikud_json(req: Req):
              result = add_nikud(req.text)
              return JSONResponse({"text": req.text, "nikud": result}, media_type="application/json; charset=utf-8")
          @app.post("/debug")
          def debug(req: Req):
              result = add_nikud(req.text)
              return {"input": req.text, "output": result, "nak": nak is not None}
          @app.post("/nikud_text", response_class=PlainTextResponse)
          def nikud_text(req: Req):
              return PlainTextResponse(add_nikud(req.text), media_type="text/plain; charset=utf-8")
          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="127.0.0.1", port=8080)
          "@ | Set-Content dicta_offline_service.py -Encoding UTF8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build EXE
        shell: pwsh
        run: |
          pip install nakdimon fastapi uvicorn pyinstaller
          python -c "from nakdimon import Nakdimon; n=Nakdimon(); print(n.nakdan('שלום עולם'))"
          pyinstaller --onefile dicta_offline_service.py -n dicta_offline_x64 --clean --noconfirm --collect-data nakdimon --collect-all nakdimon --hidden-import nakdimon
          dir dist
          Write-Host "EXE built - should have /nikud endpoints"

      - uses: actions/upload-artifact@v5
        with:
          name: dicta-fixed-exe
          path: dist/dicta_offline_x64.exe
