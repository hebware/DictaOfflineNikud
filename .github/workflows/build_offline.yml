
name: Build Dicta WITH Torch - Full Offline
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create service with debug
        shell: pwsh
        run: |
          @"
          from fastapi import FastAPI
          from fastapi.responses import PlainTextResponse, JSONResponse
          from pydantic import BaseModel
          import traceback
          app = FastAPI()
          class Req(BaseModel):
              text: str
          nak = None
          load_error = ""
          try:
              print("Loading Nakdimon...")
              from nakdimon import Nakdimon
              nak = Nakdimon()
              test = nak.nakdan("שלום עולם")
              print(f"Test: {test}")
              load_error = f"OK - {test}"
          except Exception as e:
              load_error = f"Failed: {e} {traceback.format_exc()}"
              print(load_error)
              nak = None
          def add_nikud(t):
              if nak is None:
                  return t
              try:
                  r = nak.nakdan(t)
                  return "".join(c for c in r if not (0x0591 <= ord(c) <= 0x05AF))
              except:
                  return t
          @app.get("/", response_class=PlainTextResponse)
          def root():
              return f"nak={nak is not None} error={load_error}"
          @app.post("/nikud", response_class=PlainTextResponse)
          def nikud_plain(req: Req):
              return PlainTextResponse(add_nikud(req.text), media_type="text/plain; charset=utf-8")
          @app.post("/nikud_json")
          def nikud_json(req: Req):
              return JSONResponse({"nikud": add_nikud(req.text), "nak": nak is not None, "error": load_error})
          @app.post("/debug")
          def debug(req: Req):
              return {"input": req.text, "output": add_nikud(req.text), "nak": nak is not None, "error": load_error}
          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="127.0.0.1", port=8080)
          "@ | Set-Content dicta_service.py -Encoding UTF8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build EXE WITH Torch (will be big ~400MB)
        shell: pwsh
        run: |
          pip install --upgrade pip
          pip install nakdimon fastapi uvicorn pyinstaller torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "from nakdimon import Nakdimon; n=Nakdimon(); print(n.nakdan('שלום עולם'))"
          Write-Host "Building with torch..."
          pyinstaller --onefile dicta_service.py -n dicta_offline_x64 --clean --noconfirm --collect-data nakdimon --collect-all nakdimon --collect-all torch --hidden-import torch --hidden-import nakdimon --hidden-import torch --hidden-import torch.nn --hidden-import torch.nn.functional
          dir dist
          $size = (Get-Item dist/dicta_offline_x64.exe).Length / 1MB
          Write-Host "EXE size: $size MB - includes torch, should work!"

      - uses: actions/upload-artifact@v5
        with:
          name: dicta-with-torch
          path: dist/dicta_offline_x64.exe
